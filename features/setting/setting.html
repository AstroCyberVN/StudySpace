<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../assets/images/capybara.JPG">
    <title>Cài đặt - Study Space</title>
    <link rel="stylesheet" href="../../main.css">
    <script type="module" src="../../javascript.js"></script>
    <style>
        .about-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - var(--navbar-height) - 80px);
        }

        .about-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 56px;
            text-align: center;
            max-width: 480px;
            width: 100%;
            position: relative;
            overflow: hidden;
            animation: cardEntrance 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .about-card::before {
            content: '';
            position: absolute;
            top: -60px; left: 50%;
            transform: translateX(-50%);
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(34,211,238,0.15) 0%, transparent 70%);
            pointer-events: none;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
            50%       { opacity: 1;   transform: translateX(-50%) scale(1.2); }
        }

        .avatar-ring {
            position: relative;
            display: inline-block;
            margin-bottom: 24px;
            animation: avatarEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
        }

        @keyframes avatarEntrance {
            from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
            to   { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        .avatar-ring img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 1;
        }

        .avatar-ring::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(var(--accent), #3b82f6, #a855f7, var(--accent));
            animation: ringRotate 3s linear infinite;
            z-index: 0;
        }

        .avatar-ring::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            background: var(--card-bg);
            z-index: 0;
        }

        .avatar-ring img { z-index: 2; }

        @keyframes ringRotate {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .app-name {
            font-size: 2rem;
            font-weight: 700;
            color: var(--fg-primary);
            margin-bottom: 8px;
            animation: fadeUp 0.6s ease 0.35s both;
        }

        .app-tagline {
            color: var(--fg-secondary);
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 24px;
            animation: fadeUp 0.6s ease 0.45s both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .badge-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeUp 0.6s ease 0.55s both;
        }

        .badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .badge-version {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .badge-edition {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--fg-secondary);
        }

        .author-line {
            margin-top: 28px;
            color: var(--fg-secondary);
            font-size: 0.85rem;
            animation: fadeUp 0.6s ease 0.65s both;
        }

        .author-line strong {
            color: var(--accent);
        }

        .divider {
            width: 48px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin: 20px auto;
            animation: fadeUp 0.6s ease 0.5s both;
        }
    </style>
</head>
<body>
    <div id="navbar"></div>
    <div id="sidebar"></div>
    <main class="main-container">
        <div class="about-wrapper">
            <div class="about-card">
                <div class="avatar-ring">
                    <img src="../../assets/images/capybara.JPG" alt="Capybara mascot">
                </div>

                <div class="app-name">Study Space</div>

                <div class="divider"></div>

                <p class="app-tagline">
                    Không gian học tập cá nhân hóa — thời khóa biểu, Pomodoro,
                    bộ công cụ học tập, và workspace linh hoạt trong một nơi.
                </p>

                <div class="badge-row">
                    <span class="badge badge-version">v1.0.0</span>
                    <span class="badge badge-edition">🐾 Capybara Edition</span>
                </div>

                <div class="author-line">
                    Phát triển bởi <strong>ASTRO</strong>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
