<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../assets/images/capybara.JPG">
    <title>Workspace - Notebook & Web</title>
    <link rel="stylesheet" href="../../main.css">
    <script type="module" src="../../javascript.js"></script>
    <style>
        .split-container {
            display: flex;
            height: calc(100vh - var(--navbar-height));
            margin-top: var(--navbar-height);
        }
        .split-pane {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .split-pane:nth-child(1) {
            border-right: 2px solid var(--border);
        }
        .split-pane-header {
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .split-pane-header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--accent);
        }
        .split-pane-content {
            flex: 1;
            overflow: auto;
            padding: 16px;
            background: var(--bg-primary);
        }
        .split-pane-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .audio-player {
            width: 100%;
            margin-top: 16px;
        }
        .notes-editor {
            width: 100%;
            height: 100%;
            min-height: 200px;
            font-family: inherit;
            resize: none;
        }
        .splitter {
            background: var(--border);
            width: 4px;
            cursor: col-resize;
            user-select: none;
            z-index: 10;
        }
        .splitter:hover {
            background: var(--accent);
        }
        .tab-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--fg-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .control-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .control-group label {
            color: var(--fg-secondary);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div id="navbar" style="height: 60px;"></div>
    <div id="sidebar" style="min-height: calc(100vh - 60px);"></div>
    <div class="split-container">
        <!-- Left Pane: Webview & Audio -->
        <div class="split-pane">
            <div class="split-pane-header">
                <h2>🌐 Webview & Audio</h2>
                <div class="tab-container">
                    <button class="tab-btn active" data-tab="web">Web</button>
                    <button class="tab-btn" data-tab="audio">Âm nhạc</button>
                </div>
            </div>
            <div class="split-pane-content">
                <div id="web-tab" class="tab-content active">
                    <input type="text" id="url-input" class="input" placeholder="Nhập URL trang web (ví dụ: https://www.youtube.com)" style="width: 100%; margin-bottom: 12px;">
                    <button class="btn btn-primary" id="load-web">Tải trang</button>
                    <iframe id="webview" src="about:blank"></iframe>
                </div>
                <div id="audio-tab" class="tab-content">
                    <div class="audio-player">
                        <input type="file" id="audio-file" accept="audio/*" style="margin-bottom: 12px;">
                        <div>
                            <button class="btn btn-secondary" id="play-audio">Play</button>
                            <button class="btn btn-secondary" id="pause-audio">Pause</button>
                            <button class="btn btn-secondary" id="stop-audio">Stop</button>
                        </div>
                        <div style="margin-top: 12px; display: flex; align-items: center; gap: 12px;">
                            <span>Thời gian: </span>
                            <span id="audio-time">00:00 / 00:00</span>
                        </div>
                        <input type="range" id="audio-seeker" min="0" max="100" value="0" style="width: 100%; margin-top: 8px;">
                        <div style="margin-top: 12px; display: flex; justify-content: space-between;">
                            <span>Âm lượng: </span>
                            <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5" style="width: 150px;">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Splitter -->
        <div class="splitter" id="splitter"></div>

        <!-- Right Pane: Notes -->
        <div class="split-pane">
            <div class="split-pane-header">
                <h2>📝 Ghi chú</h2>
                <div class="control-group">
                    <button class="btn btn-secondary" id="clear-notes">Xóa</button>
                    <button class="btn btn-primary" id="save-notes">Lưu</button>
                </div>
            </div>
            <div class="split-pane-content">
                <textarea id="notes-editor" class="notes-editor" placeholder="Ghi chú của bạn ở đây..."></textarea>
            </div>
        </div>
    </div>

    <script type="module">
        import { ROOT } from '../../javascript.js';

        // ========== Splitter Resize ==========
        const splitter = document.getElementById('splitter');
        const leftPane = document.querySelector('.split-pane:nth-child(1)');
        const rightPane = document.querySelector('.split-pane:nth-child(2)');

        let isResizing = false;

        splitter.addEventListener('mousedown', e => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            e.preventDefault();
        });

        document.addEventListener('mousemove', e => {
            if (!isResizing) return;
            const containerWidth = document.querySelector('.split-container').clientWidth;
            const leftWidth = e.clientX - leftPane.getBoundingClientRect().left;
            const minWidth = 200;
            const maxWidth = containerWidth - minWidth - 4; // 4px splitter width
            if (leftWidth < minWidth) leftPane.style.width = `${minWidth}px`;
            else if (leftWidth > maxWidth) leftPane.style.width = `${maxWidth}px`;
            else leftPane.style.width = `${leftWidth}px`;
        });

        document.addEventListener('mouseup', e => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
            }
        });

        // ========== Tab Switching ==========
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tabId = btn.dataset.tab + '-tab';
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');
            });
        });

        // ========== Webview ==========
        const urlInput = document.getElementById('url-input');
        const loadWebBtn = document.getElementById('load-web');
        const webview = document.getElementById('webview');

        loadWebBtn.addEventListener('click', () => {
            let url = urlInput.value.trim();
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }
            webview.src = url;
        });

        urlInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') {
                loadWebBtn.click();
            }
        });

        // ========== Audio Player ==========
        const audioFileInput = document.getElementById('audio-file');
        const playAudioBtn = document.getElementById('play-audio');
        const pauseAudioBtn = document.getElementById('pause-audio');
        const stopAudioBtn = document.getElementById('stop-audio');
        const audioTimeSpan = document.getElementById('audio-time');
        const audioSeeker = document.getElementById('audio-seeker');
        const volumeSlider = document.getElementById('volume');

        let audio = new Audio();
        let audioDuration = 0;

        audioFileInput.addEventListener('change', e => {
            const file = e.target.files[0];
            if (file) {
                audio.src = URL.createObjectURL(file);
                audio.load();
            }
        });

        playAudioBtn.addEventListener('click', () => {
            audio.play();
        });

        pauseAudioBtn.addEventListener('click', () => {
            audio.pause();
        });

        stopAudioBtn.addEventListener('click', () => {
            audio.pause();
            audio.currentTime = 0;
        });

        audio.addEventListener('loadedmetadata', () => {
            audioDuration = audio.duration;
            audioSeeker.max = Math.floor(audioDuration);
            updateTimeDisplay();
        });

        audio.addEventListener('timeupdate', () => {
            audioSeeker.value = Math.floor(audio.currentTime);
            updateTimeDisplay();
        });

        audioSeeker.addEventListener('input', e => {
            audio.currentTime = e.target.value;
        });

        volumeSlider.addEventListener('input', e => {
            audio.volume = e.target.value;
        });

        function updateTimeDisplay() {
            const current = Math.floor(audio.currentTime);
            const duration = Math.floor(audio.duration);
            const format = (t) => {
                const h = Math.floor(t / 3600).toString().padStart(2, '0');
                const m = Math.floor((t % 3600) / 60).toString().padStart(2, '0');
                const s = (t % 60).toString().padStart(2, '0');
                return `${h}:${m}:${s}`;
            };
            audioTimeSpan.textContent = `${format(current)} / ${format(duration)}`;
        }

        // ========== Notes Editor ==========
        const notesEditor = document.getElementById('notes-editor');
        const clearNotesBtn = document.getElementById('clear-notes');
        const saveNotesBtn = document.getElementById('save-notes');

        const savedNotes = localStorage.getItem('workspace-notes');
        if (savedNotes) {
            notesEditor.value = savedNotes;
        }

        notesEditor.addEventListener('input', () => {
            // Auto-save every change? Or on save button. Let's do on input for simplicity.
            localStorage.setItem('workspace-notes', notesEditor.value);
        });

        clearNotesBtn.addEventListener('click', () => {
            if (confirm('Xóa toàn bộ ghi chú?')) {
                notesEditor.value = '';
                localStorage.removeItem('workspace-notes');
            }
        });

        saveNotesBtn.addEventListener('click', () => {
            alert('Ghi chú đã được lưu tự động!');
        });
    </script>
</body>
</html>
